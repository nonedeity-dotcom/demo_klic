# The tip rotation and the reference, on a device.
#
# The tip advances on every open, so its number is the assertion: a clean
# install starts at 1, and relaunching moves it to 2. That covers both ways
# the counter can step — a genuine cold start re-runs the JS, and a relaunch
# of a process Android kept alive comes back through the foreground handler.
# The text itself isn't asserted; the number is what has to be right.
appId: com.yourcompany.noburnout
---
- launchApp:
    clearState: true
- assertVisible: "Подсказка 1 из \\d+"
- takeScreenshot: tip-1
- launchApp
- assertVisible: "Подсказка 2 из \\d+"
- takeScreenshot: tip-2

- tapOn: "Настройки"
- tapOn: "Подсказки"
- assertVisible: "Фокус"
- assertVisible: "Дофамин и триггеры"
- scrollUntilVisible:
    element:
      text: "Яма и плато"
    direction: DOWN
- assertVisible: "Действие вместо анализа"
# Sections start collapsed except the first, so a tip from Фокус is on screen.
- scrollUntilVisible:
    element:
      text: "Перед работой — 10–20 минут скуки"
    direction: UP
- tapOn: "Перед работой — 10–20 минут скуки"
# The paragraph behind the one-liner.
- assertVisible: "Тишина: без экрана, без музыки, без ленты.*"
- takeScreenshot: library

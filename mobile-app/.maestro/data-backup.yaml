# Checks the backup UI on a real device, which the browser-based checks
# can't: expo-file-system / expo-sharing are native modules with no web
# implementation, so the web build runs a Blob-download shim instead. The
# assertion that matters is the last one — the "Файл no-burnout-….json"
# note only renders after writeAsStringAsync AND shareAsync have both
# resolved, so seeing it proves the native write and the share sheet
# actually worked, not just that the buttons rendered.
#
# Run 26 pressed Back ~1s after the tap, before the chooser had come up, so
# this waits for the screen to settle first and returns to Отчёт explicitly
# (Back in a bottom-tab navigator can pop to the first tab).
#
# Run 27 then showed the native path genuinely works — the chooser listed
# no-burnout-2026-09-01.json, and logcat's view dump carried the app's own
# "Файл no-burnout-2026-09-01.json готов" — but the assertion still failed:
# that node measured y 615-591 on a 640px screen, i.e. entirely below the
# visible area, so Maestro rightly reported it invisible. The app now puts
# the note above the buttons, and this scrolls to it rather than assuming
# the viewport is already in the right place.
appId: com.yourcompany.noburnout
---
- launchApp
- tapOn: "Отчёт"
# The section sits at the bottom of a scrolling report, so it is off-screen
# on the emulator's 320x640 viewport on arrival.
- scrollUntilVisible:
    element:
      text: "Скачать данные"
    direction: DOWN
- assertVisible: "Скачать данные"
- assertVisible: "Загрузить из файла"
- tapOn: "Скачать данные"
# Writing the file and launching the chooser takes longer than the implicit
# wait after a tap.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: backup-share-sheet
# Dismisses the system share sheet; shareAsync resolves on dismissal and the
# app then renders its confirmation.
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Отчёт"
# The confirmation renders at the bottom of a scrolling screen; scroll to it
# rather than assuming the tap left the viewport in the right place.
- scrollUntilVisible:
    element:
      text: "Файл no-burnout-.*\\.json.*"
    direction: DOWN
    timeout: 20000
- assertVisible: "Файл no-burnout-.*\\.json.*"
- takeScreenshot: backup

# Checks the backup UI on a real device, which the browser-based checks
# can't: expo-file-system / expo-sharing are native modules with no web
# implementation, so the web build runs a Blob-download shim instead. The
# assertion that matters is the last one — the "Файл no-burnout-….json"
# note only renders after writeAsStringAsync AND shareAsync have both
# resolved, so seeing it proves the native write and the share sheet
# actually worked, not just that the buttons rendered.
#
# Nothing on the settings screen is assumed to be on screen: it has grown
# (notification status, screen-time limit) and Данные is now well below the
# fold on a 640px device — run 29 failed on exactly that, asserting a
# section header that had simply scrolled out of view.
appId: com.yourcompany.noburnout
---
- launchApp
- tapOn: "Настройки"
- scrollUntilVisible:
    element:
      text: "Данные"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Скачать данные"
    direction: DOWN
- assertVisible: "Скачать данные"
- assertVisible: "Загрузить из файла"
- tapOn: "Скачать данные"
# Writing the file and launching the chooser takes longer than the implicit
# wait after a tap.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: backup-share-sheet
# Dismisses the system share sheet; shareAsync resolves on dismissal and the
# app then renders its confirmation.
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Файл no-burnout-.*\\.json.*"
    direction: DOWN
    timeout: 20000
- assertVisible: "Файл no-burnout-.*\\.json.*"
- takeScreenshot: backup

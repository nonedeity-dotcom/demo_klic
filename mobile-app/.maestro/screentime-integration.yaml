# Checks that the creker integration actually reaches the UI: app launches,
# the "screentime" habit and its "Creker" tag render (i.e. no crash before
# TodayScreen's sync effect runs), and takes a screenshot for a human/Claude
# to visually confirm the checkbox itself is ticked — Maestro can assert
# text is on screen but not a checkbox's fill color, so the screenshot is
# still the source of visible confirmation for "did it actually auto-tick".
#
# The app now opens on Отчёт, not the checklist, so the flow navigates there
# first. The screentime habit is seeded last (10th of 10 default habits),
# below the fold on the emulator's 320x640 viewport — confirmed by log:
# the header assertion passed instantly, but the habit label failed even
# though the screen had rendered correctly. scrollUntilVisible finds it by
# scrolling instead of assuming it starts on-screen. The "Creker" tag sits
# next to the label on a row that wraps on narrow screens (fixed a real
# overflow bug: the tag rendered off-screen because the row had no
# flexWrap), so it can land on its own line below the label — scrolled to
# separately rather than assumed to already be in frame.
appId: com.yourcompany.noburnout
---
- launchApp
- tapOn: "Чек-лист"
- assertVisible: "Сегодня выполнено \\d+ из \\d+"
- scrollUntilVisible:
    element:
      text: "Экранное время в норме"
    direction: DOWN
- assertVisible: "Экранное время в норме"
- scrollUntilVisible:
    element:
      text: "Creker"
    direction: DOWN
- assertVisible: "Creker"
- takeScreenshot: today

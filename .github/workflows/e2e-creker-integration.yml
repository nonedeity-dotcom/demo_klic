name: E2E check — creker integration

# Manual only: boots an Android emulator, seeds creker with a known
# screen-time value via its CI-only instrumented test (SeedTestDataTest —
# lives in creker's app/src/androidTest, never ships in a real APK),
# installs the real no-burnout release APK next to it, launches it, and
# screenshots + logcats the result. This is the only way to check that data
# actually crosses from creker's ContentProvider into no-burnout's native
# module — a build succeeding proves the code compiles, not that the two
# apps can actually talk to each other on a device.
#
# Two separate jobs, not one: building no-burnout's APK (RN/Compose gradle
# cache) and running the emulator (Android SDK + a several-GB system image)
# together ran the single runner out of disk mid-emulator-setup ("No space
# left on device") — confirmed by log, not a guess. Splitting them gives
# each its own fresh runner with the full ~14GB free, connected by an
# artifact upload/download instead of sharing one disk.

on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: no-burnout

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build no-burnout release APK
        working-directory: no-burnout/mobile-app
        run: |
          npm install

          # `expo prebuild` fetches the bare-minimum template from the npm
          # registry's CDN — confirmed (via 3 genuine retries, 20s apart,
          # each an independent DNS+connection attempt) to fail 100% of the
          # time from this specific runner pool with an instant "network
          # timeout", while the very same file downloads fine from this
          # session directly. Not a flake to retry around, so instead: use
          # the exact tarball --template accepts a local file for, fetched
          # once outside CI and committed to .github/e2e-assets/. Bypasses
          # that network path entirely rather than working around it.
          #
          # expo prebuild also exits 0 even when it fails (confirmed: prints
          # "✖ Failed to create the native directory" then returns success
          # anyway) — the filesystem outcome is checked, not $?, since the
          # exit code can't be trusted.
          EXPO_OFFLINE=1 CI=1 npx expo prebuild --platform android \
            --template "$GITHUB_WORKSPACE/no-burnout/.github/e2e-assets/expo-template-bare-minimum-51.0.56.tgz"
          if [ ! -f android/settings.gradle ]; then
            echo "prebuild failed even with the cached template — see log above"
            exit 1
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Dump merged manifest for diagnosis
        working-directory: no-burnout/mobile-app
        run: |
          MANIFEST=$(find android/app/build/intermediates -iname "AndroidManifest.xml" -path "*release*" | head -n 1)
          echo "Merged manifest: $MANIFEST"
          if [ -n "$MANIFEST" ]; then
            grep -n -A2 -B2 "creker\|queries\|READ_USAGE" "$MANIFEST" || echo "no creker-related lines found in merged manifest"
          fi

      - name: Locate no-burnout APK
        id: nb_apk
        run: |
          APK=$(find no-burnout/mobile-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" ./app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: no-burnout-apk
          path: app-release.apk
          retention-days: 1

  e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: no-burnout

      # creker is a public repo on the same account, so this needs no token —
      # a plain checkout works exactly like it would for any public repo.
      - uses: actions/checkout@v4
        with:
          repository: nonedeity-dotcom/creker
          ref: claude/screentime-content-provider
          path: creker

      - uses: actions/download-artifact@v4
        with:
          name: no-burnout-apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Seed creker, install no-burnout, verify + screenshot via Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Confirmed by log: this action runs each line of `script` as its own
          # independent `sh -c` invocation, not as one cohesive script — a `cd`
          # or `export` on one line has no effect on the next line ("chmod:
          # cannot access 'gradlew'" even though the previous line was `cd
          # creker`). So every line here is self-contained: no bare `cd`, no
          # `export` relied on by a later line, no `\` continuation across
          # lines — dependent steps are chained with `&&` inside one line.
          script: |
            chmod +x creker/gradlew
            (cd creker && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.creker.screentime.SeedTestDataTest --no-daemon)
            adb install -r ./app-release.apk
            echo "=== pm list packages (creker/noburnout) ===" && adb shell pm list packages | grep -E "creker|noburnout"
            echo "=== dumpsys package creker: Providers ===" && adb shell dumpsys package com.creker.screentime | grep -A5 "Providers:"
            echo "=== adb shell content query (broad shell visibility) ===" && adb shell content query --uri content://com.creker.screentime.provider/device_usage --bind 0:s:$(date -u +%F) --bind 1:s:$(date -u +%F)
            curl -Ls "https://get.maestro.mobile.dev" | bash
            (export PATH="$PATH:$HOME/.maestro/bin" && maestro test no-burnout/mobile-app/.maestro/screentime-integration.yaml)
            adb logcat -d > logcat.txt

      - name: Locate Maestro screenshot
        if: always()
        run: |
          # Confirmed by log: Maestro logged "Take screenshot today... COMPLETED"
          # yet this search still came up empty at maxdepth 4 — it saves under
          # ~/.maestro/tests/<run-timestamp>/ (nested deeper than 4, unlike the
          # top-level debug dir Maestro prints on a failed assertion), so this
          # widens the search instead of guessing a fixed depth.
          SHOT=$(find "$HOME" . -iname "today.png" 2>/dev/null | head -n 1)
          echo "Found screenshot: $SHOT"
          find "$HOME/.maestro" -iname "*.png" 2>/dev/null || true
          [ -n "$SHOT" ] && cp "$SHOT" ./today-screenshot.png || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            today-screenshot.png
            logcat.txt
            creker/app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      # actions/upload-artifact puts files behind an Azure Blob Storage
      # redirect that this session's own egress policy blocks, so there is
      # no way to fetch the artifact zip from inside this session to
      # actually look at the screenshot. Pushing it to a small dedicated
      # branch instead makes it reachable through the GitHub Contents API
      # (api.github.com, which this session can reach directly) — force-push
      # so the branch holds just the latest run's screenshot, not a growing
      # history of images.
      - name: Publish screenshot + logcat to e2e-results branch for review
        if: always()
        working-directory: no-burnout
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan e2e-results
          git rm -rf . >/dev/null 2>&1 || true
          [ -f ../today-screenshot.png ] && cp ../today-screenshot.png today-screenshot.png
          [ -f ../logcat.txt ] && cp ../logcat.txt logcat.txt
          git add -A
          git commit -m "e2e: results from run ${{ github.run_id }}"
          git push -f origin e2e-results

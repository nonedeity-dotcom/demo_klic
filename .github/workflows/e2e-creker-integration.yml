name: E2E check — creker integration

# Manual only: boots an Android emulator, seeds creker with a known
# screen-time value via its CI-only instrumented test (SeedTestDataTest —
# lives in creker's app/src/androidTest, never ships in a real APK),
# installs the real no-burnout release APK next to it, launches it, and
# screenshots + logcats the result. This is the only way to check that data
# actually crosses from creker's ContentProvider into no-burnout's native
# module — a build succeeding proves the code compiles, not that the two
# apps can actually talk to each other on a device.

on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout no-burnout (this repo)
        uses: actions/checkout@v4
        with:
          path: no-burnout

      # creker is a public repo on the same account, so this needs no token —
      # a plain checkout works exactly like it would for any public repo.
      - name: Checkout creker
        uses: actions/checkout@v4
        with:
          repository: nonedeity-dotcom/creker
          ref: claude/screentime-content-provider
          path: creker

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build no-burnout release APK
        working-directory: no-burnout/mobile-app
        run: |
          npm install
          for i in 1 2 3; do
            # `cmd && break` as a bare statement still trips bash -e (GitHub Actions'
            # default shell) on cmd's failure before `break` even runs — the `if`
            # form is the one `set -e` exempts, so this is the version that
            # actually retries instead of aborting on attempt 1.
            if EXPO_OFFLINE=1 CI=1 npx expo prebuild --platform android; then
              break
            fi
            echo "prebuild attempt $i failed (likely a registry.npmjs.org timeout fetching the bare-minimum template) — retrying in 15s"
            rm -rf android
            sleep 15
          done
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate no-burnout APK
        id: nb_apk
        run: |
          APK=$(find no-burnout/mobile-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Seed creker, install no-burnout, verify + screenshot via Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e

            # Installs creker's debug app + its instrumentation test APK, runs
            # just SeedTestDataTest (inserts one device_usage row, then
            # self-checks it reads back through the real ContentProvider URI —
            # fails right here if that part is broken).
            cd creker
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.creker.screentime.SeedTestDataTest \
              --no-daemon
            cd ..

            adb install -r "${{ steps.nb_apk.outputs.path }}"

            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro test no-burnout/mobile-app/.maestro/screentime-integration.yaml

            adb logcat -d > logcat.txt

      - name: Locate Maestro screenshot
        if: always()
        run: |
          SHOT=$(find "$HOME" . -maxdepth 4 -iname "today.png" 2>/dev/null | head -n 1)
          echo "Found screenshot: $SHOT"
          [ -n "$SHOT" ] && cp "$SHOT" ./today-screenshot.png || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            today-screenshot.png
            logcat.txt
            creker/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
